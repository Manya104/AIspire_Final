<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AISPIRE — Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@24,400,0&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#2dd4bf",
            "background-light": "#f8f6f6",
            "accent-blue": "#3b82f6",
            "accent-pink": "#ec4899"
          },
          fontFamily: { display: ["Space Grotesk", "sans-serif"] }
        }
      }
    };
  </script>
  <style>
    body { font-family: "Space Grotesk", sans-serif; }
    th { position: sticky; top: 0; background: #e2e8f0; z-index: 10; }
  </style>
</head>

<body class="bg-background-light text-slate-900 min-h-screen flex flex-col">
  <script>
    if (localStorage.getItem("isAdmin") !== "true") {
      alert("Access Denied!");
      window.location.href = "landing.html";
    }
  </script>

  <header class="sticky top-0 z-40 flex items-center justify-between border-b border-primary/10 px-6 md:px-20 py-4 bg-background-light/90 backdrop-blur-md">
    <div class="flex items-center gap-3">
      <div class="relative size-10 flex items-center justify-center">
        <div class="absolute inset-0 bg-accent-blue opacity-20 rounded-full blur-lg"></div>
        <span class="material-symbols-outlined text-primary font-bold text-2xl">blur_on</span>
      </div>
      <a href="landing.html" class="text-xl font-bold tracking-tight hover:text-primary transition-colors">AISPIRE</a>
    </div>
    <nav class="flex items-center gap-4">
      <a href="audit.html" target="_blank" class="inline-flex items-center justify-center rounded-lg h-10 px-5 bg-primary text-white text-sm font-bold shadow-lg shadow-primary/20 hover:opacity-90 transition-opacity">
        View Audit Logs
      </a>
      <a href="index.html" class="text-slate-600 text-sm font-medium hover:text-primary transition-colors">Search</a>
      <a href="landing.html" class="text-slate-600 text-sm font-medium hover:text-primary transition-colors">Home</a>
    </nav>
  </header>

  <main class="flex-1 max-w-6xl mx-auto w-full p-6">
    <h1 class="text-3xl font-bold text-center mb-6 text-slate-900">🛠 Admin Panel — Manage NCO Jobs</h1>

    <div class="mb-4">
      <input type="text" id="searchBox" placeholder="Search by title or code..."
        class="w-full px-4 py-2 border border-slate-300 rounded-xl shadow-sm focus:ring-2 focus:ring-primary focus:border-primary outline-none" />
    </div>

    <form id="jobForm" class="bg-white rounded-2xl border border-slate-200 shadow-lg p-6 mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
      <input type="hidden" id="editIndex" />
      <div>
        <label class="block font-semibold text-slate-700 mb-1">Job Code</label>
        <input type="text" id="jobCode" required
          class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-primary focus:outline-none" />
      </div>
      <div>
        <label class="block font-semibold text-slate-700 mb-1">Job Title</label>
        <input type="text" id="jobTitle" required
          class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-primary focus:outline-none" />
      </div>
      <div class="md:col-span-3">
        <label class="block font-semibold text-slate-700 mb-1">Job Description</label>
        <textarea id="jobDescription" rows="3" required
          class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-primary focus:outline-none"></textarea>
      </div>
      <div class="md:col-span-3 flex gap-4">
        <button type="submit" class="bg-primary hover:opacity-90 text-white px-5 py-2 rounded-xl shadow-lg shadow-primary/20 font-semibold transition-opacity">💾 Save Job</button>
        <button type="reset" class="bg-slate-400 hover:bg-slate-500 text-white px-5 py-2 rounded-xl font-semibold">Clear</button>
      </div>
    </form>

    <div class="overflow-x-auto shadow rounded-2xl border border-slate-200">
      <table class="min-w-full border border-slate-200 bg-white">
        <thead>
          <tr>
            <th class="py-2 px-4 border-b border-slate-200 text-slate-700">Code</th>
            <th class="py-2 px-4 border-b border-slate-200 text-slate-700">Title</th>
            <th class="py-2 px-4 border-b border-slate-200 text-slate-700">Description</th>
            <th class="py-2 px-4 border-b border-slate-200 text-slate-700">Actions</th>
          </tr>
        </thead>
        <tbody id="jobTableBody"></tbody>
      </table>
    </div>

    <div class="mt-6 text-center">
      <button id="downloadBtn"
        class="bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-3 rounded-xl shadow-lg text-lg font-semibold transition-colors">
        ⬇ Download Updated JSON
      </button>
    </div>
  </main>

  <script src="admin.js"></script>
  <script>
    document.getElementById("searchBox").addEventListener("input", function () {
      const search = this.value.toLowerCase();
      const rows = document.querySelectorAll("#jobTableBody tr");
      rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(search) ? "" : "none";
      });
    });
  </script>
</body>

</html>
