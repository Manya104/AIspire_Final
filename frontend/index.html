<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AISPIRE — NCO Semantic Search</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@24,400,0&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#2dd4bf",
            "background-light": "#f8f6f6",
            "accent-blue": "#3b82f6",
            "accent-pink": "#ec4899"
          },
          fontFamily: { display: ["Space Grotesk", "sans-serif"] }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { font-family: "Space Grotesk", sans-serif; }
  </style>
</head>
<body class="bg-background-light text-slate-900 min-h-screen flex flex-col">
  <div class="flex flex-col min-h-screen w-full">
    <header class="sticky top-0 z-50 flex items-center justify-between border-b border-primary/10 px-6 md:px-20 py-4 bg-background-light/90 backdrop-blur-md">
      <div class="flex items-center gap-3">
        <div class="relative size-10 flex items-center justify-center">
          <div class="absolute inset-0 bg-accent-blue opacity-20 rounded-full blur-lg"></div>
          <span class="material-symbols-outlined text-primary font-bold text-2xl">blur_on</span>
        </div>
        <a href="landing.html" class="text-xl font-bold tracking-tight hover:text-primary transition-colors">AISPIRE</a>
      </div>
      <nav class="flex flex-1 justify-end items-center gap-4 md:gap-6 flex-wrap">
        <a href="career-path.html" class="text-slate-600 text-sm font-medium hover:text-primary transition-colors">Career Paths</a>
        <a href="map.html" class="text-slate-600 text-sm font-medium hover:text-primary transition-colors">Map</a>
        <a href="skillcard.html" class="text-slate-600 text-sm font-medium hover:text-primary transition-colors">Skill-Card</a>
        <a href="accessible.html" class="text-slate-600 text-sm font-medium hover:text-primary transition-colors">Accessible</a>
        <a href="landing.html" class="text-slate-600 text-sm font-medium hover:text-primary transition-colors">Home</a>
      </nav>
    </header>

    <main class="flex-1 flex flex-col items-center px-4 py-8 md:py-12">
      <div class="w-full max-w-3xl bg-white/80 backdrop-blur rounded-2xl border border-slate-200 shadow-lg p-6 md:p-8">
        <h1 id="title-text" class="text-2xl md:text-3xl font-bold text-slate-900 mb-2">🔍 Discover Your Career</h1>
        <p id="subtitle-text" class="text-slate-600 mb-6">Find the perfect job using AI-enabled semantic search (based on NCO 2015)</p>

        <div class="search-bar flex gap-2 flex-wrap">
          <input type="text" id="query-input" placeholder="e.g., jobs for women in agriculture"
            class="flex-1 min-w-[200px] px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none" />
          <button id="voice-btn" title="Voice Input" class="px-4 py-3 rounded-xl bg-slate-200 hover:bg-slate-300 transition-colors">🎤</button>
          <button onclick="performSearch()" class="px-5 py-3 rounded-xl bg-primary text-white font-semibold shadow-lg shadow-primary/20 hover:opacity-90 transition-opacity">Search</button>
        </div>

        <div class="lang-toggle mt-4">
          <label class="flex items-center gap-2 cursor-pointer text-slate-600">
            <input type="checkbox" id="lang-toggle-checkbox" onchange="toggleLanguage()" class="rounded border-slate-300 text-primary focus:ring-primary" />
            <span id="lang-label">हिन्दी</span>
          </label>
        </div>

        <div id="results" class="results-grid mt-8"></div>
      </div>
    </main>

    <footer class="border-t border-slate-200 bg-white/80 py-4 text-center text-sm text-slate-500">
      <p>Built with ❤️ for the National Career Hackathon</p>
    </footer>
  </div>

  <script src="translations.js"></script>
  <script src="script.js"></script>
</body>
</html>
