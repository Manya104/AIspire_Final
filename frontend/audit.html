<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AISPIRE — Audit Logs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@24,400,0&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#2dd4bf",
            "background-light": "#f8f6f6",
            "accent-blue": "#3b82f6",
            "accent-pink": "#ec4899"
          },
          fontFamily: { display: ["Space Grotesk", "sans-serif"] }
        }
      }
    };
  </script>
  <style>
    body { font-family: "Space Grotesk", sans-serif; }
    th { position: sticky; top: 0; background: #e2e8f0; z-index: 10; }
  </style>
</head>
<body class="bg-background-light text-slate-900 min-h-screen flex flex-col">
  <header class="sticky top-0 z-40 flex items-center justify-between border-b border-primary/10 px-6 md:px-20 py-4 bg-background-light/90 backdrop-blur-md">
    <div class="flex items-center gap-3">
      <div class="relative size-10 flex items-center justify-center">
        <div class="absolute inset-0 bg-accent-blue opacity-20 rounded-full blur-lg"></div>
        <span class="material-symbols-outlined text-primary font-bold text-2xl">blur_on</span>
      </div>
      <a href="landing.html" class="text-xl font-bold tracking-tight hover:text-primary transition-colors">AISPIRE</a>
    </div>
    <nav class="flex items-center gap-4">
      <a href="admin.html" class="text-slate-600 text-sm font-medium hover:text-primary transition-colors">Admin Panel</a>
      <a href="landing.html" class="text-slate-600 text-sm font-medium hover:text-primary transition-colors">Home</a>
    </nav>
  </header>

  <main class="flex-1 max-w-6xl mx-auto w-full p-6">
    <h1 class="text-3xl font-bold text-center mb-6 text-slate-900">📜 Audit Report</h1>

    <div class="flex gap-4 mb-4 flex-wrap">
      <select id="searchCategory" class="border border-slate-300 px-3 py-2 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none">
        <option value="device">Device</option>
        <option value="action">Action</option>
        <option value="time">Time</option>
      </select>
      <input type="text" id="searchInput" placeholder="Search..."
        class="flex-1 min-w-[200px] px-4 py-2 border border-slate-300 rounded-xl shadow-sm focus:ring-2 focus:ring-primary focus:border-primary outline-none" />
    </div>

    <div class="overflow-x-auto shadow rounded-2xl border border-slate-200">
      <table class="min-w-full border border-slate-200 bg-white">
        <thead>
          <tr>
            <th class="py-2 px-4 border-b border-slate-200 text-slate-700">Device</th>
            <th class="py-2 px-4 border-b border-slate-200 text-slate-700">Action</th>
            <th class="py-2 px-4 border-b border-slate-200 text-slate-700">Time</th>
            <th class="py-2 px-4 border-b border-slate-200 text-slate-700">Details</th>
          </tr>
        </thead>
        <tbody id="auditTableBody"></tbody>
      </table>
    </div>
  </main>

  <script>
    const API_BASE = "http://127.0.0.1:5000";
    let logs = [];

    async function loadAudit() {
      try {
        const res = await fetch(`${API_BASE}/get_audit_logs`);
        logs = await res.json();
        renderAudit(logs);
      } catch (err) {
        console.error("Error loading audit log:", err);
      }
    }

    function renderAudit(data) {
      const body = document.getElementById("auditTableBody");
      body.innerHTML = "";
      data.forEach(log => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td class="border border-slate-200 px-4 py-2">${log.device}</td>
          <td class="border border-slate-200 px-4 py-2">${log.action}</td>
          <td class="border border-slate-200 px-4 py-2">${log.time}</td>
          <td class="border border-slate-200 px-4 py-2"><pre class="whitespace-pre-wrap text-sm">${JSON.stringify(log.details, null, 2)}</pre></td>
        `;
        body.appendChild(row);
      });
    }

    document.getElementById("searchInput").addEventListener("input", function() {
      const category = document.getElementById("searchCategory").value;
      const term = this.value.toLowerCase();
      const filtered = logs.filter(log =>
        String(log[category]).toLowerCase().includes(term)
      );
      renderAudit(filtered);
    });

    loadAudit();
  </script>
</body>
</html>
